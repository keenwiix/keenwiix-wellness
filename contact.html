    <main>
        <section class="contact-page" aria-label="Contact">
            <div class="contact-card-wrap">
                <div class="contact-card">

                    <!-- Фото -->
                    <div class="contact-card-photo">
                        <img src="avatar.jpeg" alt="Keenwiix Wellness" loading="lazy" />
                    </div>

                    <!-- Логотип -->
                    <div class="contact-card-logo">
                        <span class="keenwiix-logo">keenwiix</span>
                        <span class="logo-suffix">Wellness</span>
                    </div>

                    <!-- Заголовок -->
                    <h2 class="contact-card-title">We're here to help</h2>

                    <!-- Текст -->
                    <p class="contact-card-text">
                        Have questions, ideas or need support?<br />
                        Reach out to us on Telegram.
                    </p>

                    <!-- Кнопка Telegram -->
                    <a href="https://t.me/keenwiix" target="_blank" rel="noopener" class="contact-card-btn">
                        <i class="fab fa-telegram-plane"></i>
                        <span>Message on Telegram</span>
                    </a>
                </div>
            </div>
        </section>
